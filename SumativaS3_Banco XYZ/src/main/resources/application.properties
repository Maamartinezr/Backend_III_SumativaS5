spring.application.name=bankxyz-migracion-batch
server.port=8081

# --- MySQL --------------------------------------------------------------
# Base de datos relacional elegida para cumplir la pauta de la actividad.
# Si usas tu propia instalacion de MySQL, ajusta DB_USERNAME y DB_PASSWORD
# como variables de entorno o modifica estos valores localmente.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bankxyz_batch?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:bankxyz}
spring.datasource.password=${DB_PASSWORD:bankxyz}

# Ejecuta schema.sql al levantar la app (recrea las tablas de negocio cada vez)
spring.sql.init.mode=always

# Las tablas internas de Spring Batch se crean en schema.sql para que la
# base quede limpia y repetible en cada reinicio durante las pruebas.
spring.batch.jdbc.initialize-schema=never

# Los Jobs NO se disparan solos al iniciar la app: se disparan manualmente
# vía POST desde Postman, a traves de los controllers REST.
spring.batch.job.enabled=false

# Rutas de los archivos CSV oficiales incluidos dentro del proyecto.
# Spring Batch lee estos archivos como ENTRADA y luego escribe el resultado en MySQL.
# Para usar una carpeta externa local, sobreescribir estas propiedades al iniciar la app.
bankxyz.archivo-transacciones=classpath:data/transacciones.csv
bankxyz.archivo-intereses=classpath:data/intereses.csv
bankxyz.archivo-cuentas-anuales=classpath:data/cuentas_anuales.csv

logging.level.org.springframework.batch=INFO
logging.level.cl.duoc.bankxyz=DEBUG

# Parametros usados para comparar configuraciones de rendimiento.
# Para benchmark se pueden sobreescribir al iniciar:
# .\mvnw.cmd spring-boot:run -Dspring-boot.run.arguments="--bankxyz.batch.thread-count=1 --bankxyz.batch.chunk-size=5 --bankxyz.batch.config-label=hilos-1-chunk-5"
bankxyz.batch.thread-count=3
bankxyz.batch.chunk-size=5
bankxyz.batch.queue-capacity=0
bankxyz.batch.config-label=hilos-3-chunk-5
bankxyz.evidencias.directorio=target/evidencias

# Seguridad BFF por canal.
# Cada frontend debe enviar su token en el header X-BFF-Token.
# En produccion estos valores se deben entregar por variables de entorno.
bankxyz.security.bff.enabled=${BFF_SECURITY_ENABLED:true}
bankxyz.security.bff.header-name=X-BFF-Token
bankxyz.security.bff.web-token=${BFF_WEB_TOKEN:web-token-banco-xyz}
bankxyz.security.bff.mobile-token=${BFF_MOBILE_TOKEN:mobile-token-banco-xyz}
bankxyz.security.bff.atm-token=${BFF_ATM_TOKEN:atm-token-banco-xyz}
